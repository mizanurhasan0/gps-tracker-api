# PostgreSQL-only local setup; includes business data as well as history.
# A separate project name prevents accidental reuse of full-stack/legacy volumes.
name: gps-tracker-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$APP_DB_PASSWORD\" psql -h 127.0.0.1 -U gps_tracker -d gps_tracker -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
